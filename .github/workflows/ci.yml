name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Generate route types and check TypeScript
        run: npm run typecheck
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build standalone production server
        run: npm run build
      - name: Audit dependency security
        run: npm run audit
      - name: Smoke-test production routes
        run: |
          npm start > /tmp/supreme-energy.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          for route in / /products /services /about /projects /fleet /contact /quote /privacy /terms; do
            curl --fail --silent "http://localhost:3000$route" > /dev/null
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Build and run browser journeys
        run: npm run test:e2e
      - name: Save browser report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/playwright/
            test-results/playwright.xml
          if-no-files-found: ignore
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t supreme-energy:ci .
      - name: Smoke-test container
        run: |
          docker run -d --name supreme-energy -p 3000:3000 supreme-energy:ci
          trap 'docker logs supreme-energy; docker rm -f supreme-energy' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
